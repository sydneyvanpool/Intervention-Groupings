<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interventions Grouper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F7F3FF;--card:#fff;--ink:#1E1B4B;--mut:#645F8C;--line:#E4DDF8;--acc:#7C3AED;--acc2:#EC4899;--accink:#fff;--warn:#E11D48;--glow:rgba(124,58,237,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110D2A;--card:#1E1845;--ink:#F4F1FF;--mut:#B4ACE0;--line:#382F70;--acc:#A78BFA;--acc2:#F472B6;--accink:#150F36;--warn:#FF8DA1;--glow:rgba(167,139,250,.3)}}
:root[data-theme="dark"]{--bg:#110D2A;--card:#1E1845;--ink:#F4F1FF;--mut:#B4ACE0;--line:#382F70;--acc:#A78BFA;--acc2:#F472B6;--accink:#150F36;--warn:#FF8DA1;--glow:rgba(167,139,250,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;min-height:100vh;
background:radial-gradient(900px 500px at 8% -5%,rgba(236,72,153,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(14,165,233,.16),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(251,191,36,.14),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(100deg,#2A1580,#6D28D9 45%,#DB2777);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px;box-shadow:0 10px 30px -12px rgba(76,29,149,.6);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#FACC15,#FB7185,#22D3EE,#A78BFA,#FB923C)}
header img{height:42px;width:auto;display:block;background:#fff;border-radius:12px;padding:3px 10px}
header a{color:#fff;text-decoration:none;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.25rem;cursor:pointer;letter-spacing:.2px}
header .crumb{margin-left:auto;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.18);padding:4px 14px;border-radius:99px}
header .crumb:empty{display:none}
main{max-width:1180px;margin:0 auto;padding:34px 18px 70px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;margin:.2em 0 .45em;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2) 60%,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:1.8em 0 .6em}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 16px;box-shadow:0 6px 16px -10px var(--glow)}
.center{text-align:center}
.btn{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 22px;cursor:pointer;box-shadow:0 8px 20px -12px var(--glow)}
.btn:hover{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;border-color:transparent;font-size:1.15rem;padding:16px 38px;box-shadow:0 14px 30px -10px rgba(236,72,153,.6)}
.btn.pri:hover{filter:brightness(1.08) saturate(1.1);transform:translateY(-3px)}
.btn.sm{padding:6px 14px;font-size:.85rem;border-width:1.5px;border-radius:12px}
.btn.big{min-width:160px;font-size:1.1rem;padding:18px 28px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:18px 0}
.mut{color:var(--mut)}
.names .btn{color:#1E1B4B;border:2px solid rgba(255,255,255,.75);border-radius:20px;font-weight:700;box-shadow:0 14px 26px -14px rgba(30,27,75,.55)}
.names .btn:hover{filter:brightness(1.06) saturate(1.15);color:#1E1B4B;transform:translateY(-4px) rotate(-1deg);border-color:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -24px var(--glow)}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
th{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,var(--card)),color-mix(in srgb,var(--acc2) 14%,var(--card)));font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
td select,td input[type=text],.f select,.f input{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
td select:focus,td input:focus,.f select:focus,.f input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px var(--glow)}
td select{width:100%;min-width:200px}
td input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc2)}
.wrap{overflow-x:auto}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.pill{display:inline-block;padding:3px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-size:.82rem;font-weight:600;color:var(--acc)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:18px;overflow-x:auto;padding:6px 4px 16px}
.col{background:var(--card);border-radius:20px;overflow:hidden;align-self:start;box-shadow:0 18px 36px -20px rgba(30,27,75,.5);border:1px solid var(--line)}
.col .hd{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;text-align:center;padding:12px 6px 8px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.15rem;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.col .ct{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;text-align:center;padding:0 6px 10px;font-size:.85rem;font-weight:600;opacity:.95}
.col .gh{text-align:center;font-weight:700;padding:8px 8px;margin-top:8px;background:color-mix(in srgb,var(--c1) 16%,var(--card));border-top:3px solid var(--c1);border-bottom:1px solid var(--line);font-size:.9rem;color:var(--ink)}
.col .st{text-align:center;padding:5px 6px;color:#1E1B4B;font-weight:500;font-size:.92rem;border-bottom:1px solid rgba(255,255,255,.7)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px;align-items:center}
.legend span{padding:5px 16px;border-radius:99px;color:#1E1B4B;font-size:.85rem;font-weight:600;box-shadow:0 6px 14px -8px rgba(30,27,75,.5);border:2px solid rgba(255,255,255,.7)}
.note{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:14px;padding:12px 16px;margin:12px 0;font-size:.92rem;box-shadow:0 10px 24px -18px var(--glow)}
.pairs li{margin:8px 0}
@media print{header,.noprint{display:none}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{background:none;color:#1E1B4B}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .18s,background .18s,filter .18s,box-shadow .18s}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}main>*{animation:up .45s ease both}.col{animation:up .5s ease both}.col:nth-child(2){animation-delay:.06s}.col:nth-child(3){animation-delay:.12s}.col:nth-child(4){animation-delay:.18s}.col:nth-child(5){animation-delay:.24s}}
</style>
</head>
<body>
<header><a href="#" onclick="location.reload()">🎨 Interventions Grouper</a><span class="crumb"></span></header>
<main id="root"></main>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script>
const TC={Magee:"#FFD93D",Eppes:"#FF8CC6",Bosse:"#5FD6EE",Gober:"#B197FC",Vanpool:"#FFA24D"};const CC=[["#7C3AED","#C026D3"],["#EC4899","#F97316"],["#0EA5E9","#6366F1"],["#10B981","#0EA5E9"],["#F59E0B","#EF4444"]];const SK=["Phonemic Awareness","Letter Knowledge","Word Reading","Fluency","High-Frequency Words","Phonics","Decoding","Segmenting","Blending","Sight Words","Blending Sounds","Initial Sound Identification","Rhyming","Syllable Awareness","Sound Discrimination","Letter Sounds","Print Concepts","Oral Language","Listening Comprehension","Vocabulary"];const TEACHERS=Object.keys(TC);const RAW={Magee:"Aaliyah,Aaron,Abigail,Aden,Adeline,Aisha,Alec,Aliana,Allison,Alonzo,Alyssa,Amara,Amber,Ambrose,Amelia",Eppes:"Amethyst,Anastasia,Anaya,Andre,Andrea,Andres,Andrew,Andrina,Anita,Aniyah,Anna,Annabelle,Annabella,Annalise,Annmarie",Bosse:"Anson,Anthony,Antoinette,Antonia,Antonio,Antwan,Anya,Anyah,Anysha,Araceli,Ariana,Arianna,Arianny,Ariel,Arionka",Gober:"Ariyana,Aris,Aristides,Aristotle,Arjun,Arkadiusz,Arkham,Arkhip,Arlington,Arlon,Armaan,Armada,Armand,Armando,Armani",Vanpool:"Armelle,Arnaldo,Arnand,Arnaud,Arndis,Arneisha,Arnella,Arnelle,Arnette,Arney,Arnica,Arniel,Arnieta,Arnise,Arnisha"};let S={};let lastSync=null;let isSaving=false;let dbRef=null;
function route(){const h=location.hash.slice(1)||"home";const root=document.getElementById("root");root.innerHTML="";if(h==="home")showHome(root);else if(h==="data")showData(root);else if(h==="groups")showGroups(root)}
function showHome(el){return el.innerHTML=`<div class="center"><span class="eyebrow">✨ Intervention Time</span><h1>Welcome, 2nd Grade Team</h1><p class="mut">Manage rosters, update skills, and organize RTI groups</p></div><div class="row"><button class="btn pri" onclick="location.hash='data'">Update Data</button><button class="btn pri" onclick="location.hash='groups'">View RTI Groupings</button></div><div class="row"><button class="btn" onclick="printPage()">🖨️ Print</button><button class="btn noprint" onclick="resetData()">Reset Everything</button></div><div class="f"><span class="pill">Teachers: ${TEACHERS.join(", ")}</span></div><div class="legend">${TEACHERS.map(k=>`<span style="background:${TC[k]}">${k}</span>`).join("")}<span class="pill" style="border-color:var(--line)">Max 6 per group</span></div>`}
function showData(el){let t=el;S.skills||(S.skills={});const form=document.createElement("form");form.innerHTML=`<h1>Update Student Skills</h1><div class="row">${TEACHERS.map((teacher,i)=>`<button type="button" class="btn big" style="background:${TC[teacher]};color:#1E1B4B" onclick="editTeacher('${teacher}')">${teacher}</button>`).join("")}</div><h2>Teacher: <span id="current-teacher">${TEACHERS[0]}</span></h2><div class="wrap"><table><thead><tr><th>Student</th><th>Current Skill</th></tr></thead><tbody id="skill-table"></tbody></table></div><div class="f"><button type="button" class="btn" onclick="location.hash='home'">← Back</button><button type="button" class="btn pri" onclick="saveData()">Save Skills</button></div>`;t.appendChild(form);editTeacher(TEACHERS[0])}
function editTeacher(teacher){S.skills[teacher]||(S.skills[teacher]={});const tbody=document.getElementById("skill-table");tbody.innerHTML="";const names=RAW[teacher].split(",");for(let i=0;i<Math.min(names.length,6);i++){const name=names[i];const skill=S.skills[teacher][name]||"";const row=document.createElement("tr");row.innerHTML=`<td><strong>${name}</strong></td><td><select onchange="S.skills['${teacher}']['${name}']=this.value">${SK.map((s,j)=>`<option value="${j}" ${skill==j?"selected":""}>${s}</option>`).join("")}</select></td>`;tbody.appendChild(row)}document.getElementById("current-teacher").textContent=teacher}
function showGroups(el){let t=el;if(!S.skills){t.innerHTML='<h1>No data yet</h1><p>Go to "Update Data" first</p>';return}const groups={};for(const teacher of TEACHERS){const names=RAW[teacher].split(",");const skills=S.skills[teacher]||{};const byLevel={};for(const name of names){const level=parseInt(skills[name]||0);if(!byLevel[level])byLevel[level]=[];byLevel[level].push(name)}for(const level in byLevel){const students=byLevel[level];const numGroups=Math.ceil(students.length/6);for(let g=0;g<numGroups;g++){const gid=`${teacher}-${level}-${g}`;if(!groups[gid])groups[gid]={teacher,level,students:[]};const start=g*6;groups[gid].students.push(...students.slice(start,start+6))}}}let html=`<h1>RTI Groups</h1><div class="legend">${TEACHERS.map(k=>`<span style="background:${TC[k]}">${k}</span>`).join("")}</div><div class="cols">`;let i=0;for(const gid in groups){const g=groups[gid];const [c1,c2]=CC[i%CC.length];html+=`<div class="col" style="--c1:${c1};--c2:${c2}"><div class="hd">${SK[g.level]}</div><div class="ct">${g.teacher}</div><div class="gh">Group ${g.students.length}/6</div>${g.students.map(s=>`<div class="st">${s}</div>`).join("")}</div>`;i++}html+=`</div><div class="f"><button class="btn" onclick="location.hash='home'">← Back</button><button class="btn pri" onclick="printPage()">🖨️ Print</button></div>`;t.innerHTML=html}
function saveData(){localStorage.setItem("rti-state",JSON.stringify(S));if(dbRef){dbRef.set({json:JSON.stringify(S)}).catch(e=>console.error("Save error:",e))}route()}
function resetData(){if(confirm("Are you sure? This cannot be undone.")){S={};saveData();route()}}
function printPage(){window.print()}
window.addEventListener("hashchange",route);
// Firebase initialization - wait for SDK to load
function initFirebase(){if(typeof firebase==='undefined'){console.log("Firebase SDK not loaded yet, retrying...");setTimeout(initFirebase,100);return}console.log("Firebase SDK loaded, initializing...");const firebaseConfig={apiKey:"AIzaSyAUmbXM-5iuOFPRb20aFXR4QZnubFWKL9k",authDomain:"interventions-grouping.firebaseapp.com",projectId:"interventions-grouping",storageBucket:"interventions-grouping.firebasestorage.app",messagingSenderId:"563338566367",appId:"1:563338566367:web:680365fef99b04b0a0676a"};try{const app=firebase.initializeApp(firebaseConfig);const db=firebase.firestore();dbRef=db.collection("rti").doc("state");dbRef.onSnapshot(doc=>{if(!doc.exists){console.log("Firestore doc doesn't exist yet");return}const data=doc.data().json;if(!data||data===lastSync)return;try{S=JSON.parse(data);lastSync=data;localStorage.setItem("rti-state",data);const ae=document.activeElement;if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))route();console.log("✓ Synced from Firebase")}catch(e){console.error("Parse error:",e)}},err=>{console.error("Firestore error:",err)});console.log("✓ Firebase initialized")}catch(e){console.error("Firebase init error:",e)}}
// Load saved data and start app
try{const saved=localStorage.getItem("rti-state");if(saved)S=JSON.parse(saved);route();initFirebase()}catch(e){console.error("Error loading app:",e);route()}
</script>
</body>
</html>
