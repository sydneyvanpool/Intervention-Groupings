<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interventions Grouper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F7F3FF;--card:#fff;--ink:#1E1B4B;--mut:#645F8C;--line:#E4DDF8;--acc:#7C3AED;--acc2:#EC4899;--accink:#fff;--warn:#E11D48;--glow:rgba(124,58,237,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110D2A;--card:#1E1845;--ink:#F4F1FF;--mut:#B4ACE0;--line:#382F70;--acc:#A78BFA;--acc2:#F472B6;--accink:#150F36;--warn:#FF8DA1;--glow:rgba(167,139,250,.3)}}
:root[data-theme="dark"]{--bg:#110D2A;--card:#1E1845;--ink:#F4F1FF;--mut:#B4ACE0;--line:#382F70;--acc:#A78BFA;--acc2:#F472B6;--accink:#150F36;--warn:#FF8DA1;--glow:rgba(167,139,250,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5;min-height:100vh;
background:radial-gradient(900px 500px at 8% -5%,rgba(236,72,153,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(14,165,233,.16),transparent 60%),radial-gradient(700px 500px at 50% 110%,rgba(251,191,36,.14),transparent 60%),var(--bg);background-attachment:fixed}
header{background:linear-gradient(100deg,#2A1580,#6D28D9 45%,#DB2777);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 22px;box-shadow:0 10px 30px -12px rgba(76,29,149,.6);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#FACC15,#FB7185,#22D3EE,#A78BFA,#FB923C)}
header img{height:42px;width:auto;display:block;background:#fff;border-radius:12px;padding:3px 10px}
header a{color:#fff;text-decoration:none;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.25rem;cursor:pointer;letter-spacing:.2px}
header .crumb{margin-left:auto;font-size:.85rem;font-weight:500;background:rgba(255,255,255,.18);padding:4px 14px;border-radius:99px}
header .crumb:empty{display:none}
main{max-width:1180px;margin:0 auto;padding:34px 18px 70px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(1.9rem,5vw,3rem);line-height:1.1;margin:.2em 0 .45em;letter-spacing:-.5px;background:linear-gradient(90deg,var(--acc),var(--acc2) 60%,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:1.8em 0 .6em}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 16px;box-shadow:0 6px 16px -10px var(--glow)}
.center{text-align:center}
.btn{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 22px;cursor:pointer;box-shadow:0 8px 20px -12px var(--glow)}
.btn:hover{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;transform:translateY(-2px)}
.btn.pri{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;border-color:transparent;font-size:1.15rem;padding:16px 38px;box-shadow:0 14px 30px -10px rgba(236,72,153,.6)}
.btn.pri:hover{filter:brightness(1.08) saturate(1.1);transform:translateY(-3px)}
.btn.sm{padding:6px 14px;font-size:.85rem;border-width:1.5px;border-radius:12px}
.btn.big{min-width:160px;font-size:1.1rem;padding:18px 28px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:18px 0}
.mut{color:var(--mut)}
.names .btn{color:#1E1B4B;border:2px solid rgba(255,255,255,.75);border-radius:20px;font-weight:700;box-shadow:0 14px 26px -14px rgba(30,27,75,.55)}
.names .btn:hover{filter:brightness(1.06) saturate(1.15);color:#1E1B4B;transform:translateY(-4px) rotate(-1deg);border-color:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -24px var(--glow)}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:color-mix(in srgb,var(--acc) 7%,var(--card))}
th{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 16%,var(--card)),color-mix(in srgb,var(--acc2) 14%,var(--card)));font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
td select,td input[type=text],.f select,.f input{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
td select:focus,td input:focus,.f select:focus,.f input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px var(--glow)}
td select{width:100%;min-width:200px}
td input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc2)}
.wrap{overflow-x:auto}
.f{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.pill{display:inline-block;padding:3px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-size:.82rem;font-weight:600;color:var(--acc)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:18px;overflow-x:auto;padding:6px 4px 16px}
.col{background:var(--card);border-radius:20px;overflow:hidden;align-self:start;box-shadow:0 18px 36px -20px rgba(30,27,75,.5);border:1px solid var(--line)}
.col .hd{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;text-align:center;padding:12px 6px 8px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:1.15rem;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.col .ct{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;text-align:center;padding:0 6px 10px;font-size:.85rem;font-weight:600;opacity:.95}
.col .gh{text-align:center;font-weight:700;padding:8px 8px;margin-top:8px;background:color-mix(in srgb,var(--c1) 16%,var(--card));border-top:3px solid var(--c1);border-bottom:1px solid var(--line);font-size:.9rem;color:var(--ink)}
.col .st{text-align:center;padding:5px 6px;color:#1E1B4B;font-weight:500;font-size:.92rem;border-bottom:1px solid rgba(255,255,255,.7)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px;align-items:center}
.legend span{padding:5px 16px;border-radius:99px;color:#1E1B4B;font-size:.85rem;font-weight:600;box-shadow:0 6px 14px -8px rgba(30,27,75,.5);border:2px solid rgba(255,255,255,.7)}
.note{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:14px;padding:12px 16px;margin:12px 0;font-size:.92rem;box-shadow:0 10px 24px -18px var(--glow)}
.pairs li{margin:8px 0}
@media print{header,.noprint{display:none}body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}h1{background:none;color:#1E1B4B}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .18s,background .18s,filter .18s,box-shadow .18s}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}main>*{animation:up .45s ease both}.col{animation:up .5s ease both}.col:nth-child(2){animation-delay:.06s}.col:nth-child(3){animation-delay:.12s}.col:nth-child(4){animation-delay:.18s}.col:nth-child(5){animation-delay:.24s}}
</style>
</head>

<script>
const SK=["Upper Letter ID","Lower Letter ID","Vowel Names","Consonant Sounds","Long Vowel Sounds","Short Vowel Sounds","CVC Short Vowel","Onset Rime","Beginning Consonant Digraphs","Ending Consonant Digraphs","Beginning Consonant Blends","Multi-Syllable Closed","Ending Consonant Blends","Long Vowel Silent E","Long Vowel Digraphs","Other Vowel Digraphs","Vowel Diphthongs","R/L Controlled","Multi-Syllable Open","Enrichment"];
const TC={Magee:"#FFD93D",Eppes:"#FF8CC6",Bosse:"#5FD6EE",Gober:"#B197FC",Vanpool:"#FFA24D"};
const CC=[["#7C3AED","#C026D3"],["#EC4899","#F97316"],["#0EA5E9","#6366F1"],["#10B981","#0EA5E9"],["#F59E0B","#EF4444"]];
const RAW={
Magee:"Gunner A,Clara B,Norah B,Preston B,Cristian C,Charlie C,Penelope D,Ethan G,Eliana G,Karyk H,Porter H,Benjamin H,Eli J,Zoey M,Colt M,Celine N,Jacob P,Gunner P,Melody R,Carol S,Zefferin T,Ripken T",
Eppes:"Thomas C,Ameliz D,Daxton E,Scarlett G,Elena G,Gentry H,Owen H,Grace L,Eli P,Mars P,Katie P,Deacon R,Aaliyah S,Drake S,Carson S,Oliver S,Zoey S,Walker R,Michelle J",
Bosse:"Gracey B,Abigail B,Jackson B,Caelen E,Mary H,Sorsha L,Elijah L,Romeo M,Zacharay N,Lincoln N,Henry P,Amanda P,Taylor R,Jay S,Navy S,Max T,Skylar T,Gweneth C,Joker W,Jonah W,Elena Z",
Gober:"Leighton A,Ember B,Beau B,Silas C,Henry C,Karley D,Zane E,Ben H,Kaia I,AJ L,Olivia M,Annabelle P,Jason P,Ruby R,Madden R,Ella S,Sylvia S,Noah W,Abbott Y,Jessica Z,Ariana W",
Vanpool:"Aaron B,Evan C,Benson C,Jessa D,Thatcher F,Ashley F,Owen G,Oliver H,Thiên Kim H,Emma L,Maverick M,Amirah M,Bentley M,Lillian N,Makenzy P,Jaycie R,James W,Barkiel Y,Hayes Y,Gibson Y"};
const TEACHERS=Object.keys(RAW);
const sample={"Aaron B":19,"Evan C":11,"Benson C":10,"Jessa D":9};
function seed(){const t={};TEACHERS.forEach(k=>{t[k]=RAW[k].split(",").map((n,i)=>{const s=k==="Vanpool"&&n in sample?sample[n]:-1;return{id:k+"-"+i,n,s,d:s>=0?"10/6":"",x:false}})});return{t,pairs:[]}}
let S=seed(),lastJson="",dbDoc=null,timer=null;
try{const l=localStorage.getItem("rti-state");if(l)S=JSON.parse(l)}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return(d.getMonth()+1)+"/"+d.getDate()};
const all=()=>TEACHERS.flatMap(k=>S.t[k].map(s=>({...s,home:k})));
function save(){const j=JSON.stringify(S);lastJson=j;try{localStorage.setItem("rti-state",j)}catch(e){}
clearTimeout(timer);timer=setTimeout(()=>{if(dbDoc)dbDoc.set({json:j}).catch(()=>{})},400)}

/* ---------- grouping engine ---------- */
function makeGroups(){
 const ti0=TEACHERS.reduce((o,k,i)=>(o[k]=i,o),{}),A=all();
 const unset=A.filter(s=>!s.x&&s.s<0).length,excl=A.filter(s=>s.x).length;
 const arr=A.filter(s=>!s.x&&s.s>=0).sort((a,b)=>a.s-b.s||ti0[a.home]-ti0[b.home]);
 const N=arr.length,T=TEACHERS.length,cols=TEACHERS.map(()=>({groups:[],count:0,warn:[]}));
 if(!N)return{cols,unset,excl,total:0};
 const k=Math.min(T,N),avg=N/k;
 const cost=(i,j)=>{const sz=j-i,span=arr[j-1].s-arr[i].s;let p=(sz-avg)**2*.05;
  if(sz<18)p+=(18-sz)**2*1e5;if(sz>22)p+=(sz-22)**2*1e5;if(span>3)p+=(span-3)*8;
  if(j<N&&arr[j-1].s===arr[j].s)p+=30;return p};
 const INF=1e18,dp=Array.from({length:k+1},()=>Array(N+1).fill(INF)),bk=Array.from({length:k+1},()=>Array(N+1).fill(0));
 dp[0][0]=0;
 for(let m=1;m<=k;m++)for(let j=m;j<=N;j++)for(let i=m-1;i<j;i++){if(dp[m-1][i]>=INF)continue;const c=dp[m-1][i]+cost(i,j);if(c<dp[m][j]){dp[m][j]=c;bk[m][j]=i}}
 const segs=[];let e=N;for(let m=k;m>=1;m--){const i=bk[m][e];segs.unshift([i,e]);e=i}
 const bad=new Set(S.pairs.map(p=>p[0]+"|"+p[1]).concat(S.pairs.map(p=>p[1]+"|"+p[0])));
 const who={};
 segs.forEach(([i,j],ti)=>{const col=cols[ti],by={};arr.slice(i,j).forEach(s=>(by[s.s]=by[s.s]||[]).push(s));
  Object.keys(by).map(Number).sort((a,b)=>a-b).forEach(q=>{const st=by[q];(who[q]=who[q]||new Set()).add(ti);let g=Math.ceil(st.length/6),gr;
   for(;;g++){gr=Array.from({length:g},()=>[]);let ok=true;
    const deg=s=>st.filter(o=>bad.has(s.id+"|"+o.id)).length;
    for(const s of st.slice().sort((a,b)=>deg(b)-deg(a))){const opts=gr.filter(x=>x.length<6&&!x.some(o=>bad.has(s.id+"|"+o.id))).sort((a,b)=>a.length-b.length);
     if(!opts.length){ok=false;break}opts[0].push(s)}
    if(ok||g>=st.length)break}
   gr.filter(x=>x.length).forEach((x,gi,ar)=>col.groups.push({skill:q,part:ar.length>1?gi+1:0,students:x,ti}))});
  col.count=j-i;
  if(col.count>22)col.warn.push(col.count+" students, over the 22-student limit");
  else if(col.count<18&&!unset)col.warn.push(col.count+" students, under the 18-student minimum (not enough students overall)");
  if(arr[j-1].s-arr[i].s>3)col.warn.push("skills span "+(arr[j-1].s-arr[i].s)+" levels (max 3)")});
 cols.forEach((c,ti)=>c.groups.forEach(g=>{g.also=[...who[g.skill]].filter(t=>t!==ti).map(t=>t+1)}));
 return{cols,unset,excl,total:N}}

/* ---------- views ---------- */
const app=document.getElementById("app"),crumb=document.getElementById("crumb");
const nameBtns=()=>TEACHERS.map(k=>`<button class="btn big" style="background:${TC[k]}" data-go="#/t/${k}">${k}</button>`).join("");
function vWelcome(){crumb.textContent="";return`<div class="center"><span class="eyebrow">✨ Intervention Time</span><h1>Welcome, Prairie Vale</h1>
<div class="row"><button class="btn pri" data-go="#/groups">View RTI groupings</button></div>
<p class="mut">or select your name</p><div class="row names">${nameBtns()}</div>
<p class="mut" style="margin-top:44px;font-size:.88rem">Just exploring? <button class="btn sm" data-act="demo">Fill empty skills with sample data</button> <button class="btn sm" data-act="reset">Reset everything</button></p></div>`}
function vTeacher(k){crumb.textContent=k;const l=S.t[k],set=l.filter(s=>s.s>=0).length;
return`<div class="center"><h1>Welcome, ${k}</h1><p class="mut">${l.length} students · ${set} with a current skill</p>
<div class="row"><button class="btn big" data-go="#/t/${k}/update">Update data</button><button class="btn big" data-go="#/groups">View RTI groupings</button><button class="btn big" data-go="#/t/${k}/roster">Edit roster</button></div></div>`}
function vUpdate(k){crumb.textContent=k+" › Update data";const l=S.t[k];
const rows=l.map(s=>`<tr><td>${esc(s.n)}</td><td>${s.d||"–"}</td><td><select class="sk" data-id="${s.id}" aria-label="Current skill for ${esc(s.n)}"><option value="-1">Choose a skill…</option>${SK.map((x,i)=>`<option value="${i}"${s.s===i?" selected":""}>${x}</option>`).join("")}</select></td><td><input type="checkbox" class="ex" data-id="${s.id}"${s.x?" checked":""} aria-label="Exclude ${esc(s.n)} from groups"></td></tr>`).join("");
return`<h1>${k} update data</h1><p class="mut">Changes save automatically.</p><div class="wrap"><table><thead><tr><th>Roster</th><th>Last update</th><th>Current skill</th><th>Exclude from groups</th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="row"><button class="btn" data-go="#/t/${k}">Back</button><button class="btn pri" data-go="#/groups">View RTI groupings</button></div>`}
function vRoster(k){crumb.textContent=k+" › Edit roster";const l=S.t[k],A=all(),nm=id=>{const s=A.find(x=>x.id===id);return s?s.n+" ("+s.home+")":"?"};
const mine=new Set(l.map(s=>s.id)),pl=S.pairs.filter(p=>mine.has(p[0])||mine.has(p[1]));
const opt=A.map(s=>`<option value="${s.id}">${esc(s.n)} (${s.home})</option>`).join("");
return`<h1>${k} roster</h1>
<div class="f"><input type="text" id="newn" placeholder="Student name, e.g. Maya R" aria-label="New student name"><button class="btn sm" data-act="add" data-k="${k}">Add student</button></div>
<div class="wrap"><table><tbody>${l.map(s=>`<tr><td><input type="text" class="rn" data-id="${s.id}" value="${esc(s.n)}" aria-label="Student name"></td><td style="width:1%"><button class="btn sm" data-act="del" data-id="${s.id}" data-k="${k}">Remove</button></td></tr>`).join("")}</tbody></table></div>
<h2>Students who can’t be in the same group</h2>
<div class="f"><select id="pa" aria-label="First student">${opt}</select><span>and</span><select id="pb" aria-label="Second student">${opt}</select><button class="btn sm" data-act="pair">Add pair</button></div>
<ul class="pairs">${pl.map(p=>`<li>${esc(nm(p[0]))} and ${esc(nm(p[1]))} <button class="btn sm" data-act="unpair" data-a="${p[0]}" data-b="${p[1]}">Remove</button></li>`).join("")||'<li class="mut">No pairs yet.</li>'}</ul>
<div class="row"><button class="btn" data-go="#/t/${k}">Back</button></div>`}
function vGroups(){crumb.textContent="RTI groupings";const r=makeGroups();
const legend=TEACHERS.map(k=>`<span style="background:${TC[k]}">${k}</span>`).join("")+`<span class="pill" style="border-color:var(--line)">Max 6 per group</span>`;

r.cols.forEach((c,i)=>c.warn.forEach(w=>msgs.push(`Teacher ${i+1}: ${w}.`)));

return`<h1>RTI groupings</h1><div class="legend" aria-label="Color key: each student is highlighted in their teacher's color">${legend}</div>

function route(){const h=location.hash.replace(/^#\/?/,"").split("/");let v;
 if(h[0]==="groups")v=vGroups();else if(h[0]==="t"&&S.t[h[1]]){v=h[2]==="update"?vUpdate(h[1]):h[2]==="roster"?vRoster(h[1]):vTeacher(h[1])}else v=vWelcome();
 app.innerHTML=v;window.scrollTo(0,0)}
const find=id=>all().length&&TEACHERS.map(k=>S.t[k].find(s=>s.id===id)).find(Boolean);
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-act]");if(!b)return;
 if(b.dataset.go){location.hash=b.dataset.go;return}
 const a=b.dataset.act,k=b.dataset.k;
 if(a==="add"){const v=document.getElementById("newn").value.trim();if(v){S.t[k].push({id:"n"+Date.now(),n:v,s:-1,d:"",x:false});save();route()}}
 if(a==="del"){if(confirm("Remove this student from the roster?")){S.t[k]=S.t[k].filter(s=>s.id!==b.dataset.id);S.pairs=S.pairs.filter(p=>!p.includes(b.dataset.id));save();route()}}
 if(a==="pair"){const x=document.getElementById("pa").value,y=document.getElementById("pb").value;
  if(x!==y&&!S.pairs.some(p=>p.includes(x)&&p.includes(y))){S.pairs.push([x,y]);save();route()}}
 if(a==="unpair"){S.pairs=S.pairs.filter(p=>!(p.includes(b.dataset.a)&&p.includes(b.dataset.b)));save();route()}
 if(a==="demo"){TEACHERS.forEach(t=>S.t[t].forEach(s=>{if(s.s<0){s.s=Math.floor(Math.random()*SK.length);s.d=today()}}));save();location.hash="#/groups"}
 if(a==="reset"){if(confirm("Reset all rosters, skills and pairs to the starting list?")){S=seed();save();route()}}});
document.addEventListener("change",e=>{const t=e.target,s=t.dataset.id&&find(t.dataset.id);if(!s)return;
 if(t.classList.contains("sk")){s.s=+t.value;s.d=today()}
 else if(t.classList.contains("ex")){s.x=t.checked;s.d=today()}
 else if(t.classList.contains("rn")){const v=t.value.trim();if(v)s.n=v}
 save();if(!t.classList.contains("rn"))route0(t)});
function route0(t){const tr=t.closest("tr");if(tr)tr.children[1].textContent=today()}
window.addEventListener("hashchange",route);route();
</script>
